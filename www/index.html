function lapP(){const L=db.loans.filter(l=>(!ld1||l.pinjam>=ld1)&&(!ld2||l.pinjam<=ld2)).sort((a,b)=>b.pinjam.localeCompare(a.pinjam)),gu=L.reduce((s,l)=>s+l.d.reduce((t,x)=>t+(x.gt=='uang'?Number(x.gu)||0:0),0),0),img=u=>u?`<br><img class="th" src="${u}">`:'';
const rows=L.flatMap(l=>l.d.map(x=>{const b=it(x.iid);return `<tr><td>${fd(l.pinjam)}</td><td>${esc(bn(l.bid).nama)}</td><td><b>${esc(b.kode)}</b><br>${esc(b.nama)}</td><td>${esc(x.cat||'-')}${img(x.fp)}</td><td>${x.k?`${x.k=='baik'?'normal':x.k}${x.cr?'<br>'+esc(x.cr):''}${img(x.fk)}`:'Belum kembali'}</td><td>${l.kembali?fd(l.kembali)+(l.kembali>l.rencana?`<br>telat ${dd(l.rencana,l.kembali)} hari`:''):(late(l)?'Terlambat':'-')}</td><td>${x.gt=='uang'?rpf(x.gu):x.gt=='barang'?esc(x.gn)+' x'+x.gq:'-'}</td></tr>`})).join('');
return `<div class="no-print">${swc()}<div class="two"><label>Dari tanggal<input type="date" value="${ld1}" onchange="ld1=this.value;draw()"></label><label>Sampai tanggal<input type="date" value="${ld2}" onchange="ld2=this.value;draw()"></label></div><button class="p" onclick="cetak()">Cetak laporan</button></div><div class="rep"><h2>Laporan Peminjaman Barang</h2><p class="mu">INPENA, Karang Taruna Arjuna 01/04. ${ld1||ld2?`Periode ${fd(ld1)} s/d ${fd(ld2)}`:'Semua periode'}. Dicetak oleh ${esc(me.nama)}.</p><div class="c good"><b>${L.length} peminjaman, ${L.filter(l=>l.status=='dipinjam').length} belum kembali. Ganti rugi uang: ${rpf(gu)}</b></div>${rows?`<div class="tw"><table><tr><th>Tgl pinjam</th><th>Peminjam</th><th>Barang</th><th>Kondisi dan catatan saat pinjam</th><th>Kondisi dan catatan saat kembali</th><th>Tgl kembali</th><th>Ganti rugi</th></tr>${rows}</table></div>`:'<p class="mu">Tidak ada data.</p>'}<div class="sign"><p>Mengetahui,</p><br><br><p>(................................)</p></div></div>`}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);drawPick()}
function loanS(){const b=$('#pb').value;run('createLoan',{b:b=='new'?0:+b,nb:b=='new'?{nama:$('#bn').value,hp:$('#bh').value,alamat:$('#ba').value}:null,d1:$('#d1').value,d2:$('#d2').value,ids:[...sel],cats:nt,fotos:Object.fromEntries([...sel].filter(i=>pp[i]).map(i=>[i,pp[i]]))},()=>{sel.clear();nt={};pp={};pq='';tab='riwayat';draw();toast('Peminjaman disimpan')})}
function retM(id){rp={};const l=db.loans.find(x=>x.id==id);modal(`<h2>Pengembalian</h2><p class="mu">${esc(bn(l.bid).nama)}</p><div class="c"><label>Tanggal pengembalian<input type="date" id="rt" value="${today()}" min="${l.pinjam}" max="${today()}"></label><div class="chips"><button onclick="$('#rt').value=today()">Hari ini</button><button onclick="$('#rt').value=addD(today(),-1)">Kemarin</button>${l.rencana<=today()?`<button onclick="$('#rt').value='${l.rencana}'">Sesuai rencana</button>`:''}</div><p class="mu">Atur tanggal barang sebenarnya dikembalikan supaya tidak dihitung terlambat.</p></div>${l.d.map(x=>{const i=it(x.iid);return `<div class="c"><b>${esc(i.kode)}, ${esc(i.nama)}</b><p class="mu">Saat dipinjam: ${esc(x.cat||'-')}</p><label>Kondisi sekarang<select data-i="${i.id}" onchange="rg(this)"><option value="baik">Baik</option><option value="rusak">Rusak</option><option value="hilang">Hilang</option></select></label><label>Catatan kondisi saat kembali<input data-c="${i.id}"></label><label>Foto kondisi saat kembali<input type="file" accept="image/*" capture="environment" onchange="retPh(${i.id},this)"></label><img id="pv${i.id}" class="pv" hidden><div id="g${i.id}" hidden><label>Ganti rugi<select data-t="${i.id}" onchange="rg(this)"><option value="">Belum ada</option><option value="barang">Barang pengganti</option><option value="uang">Uang</option></select></label><div id="gb${i.id}" hidden><label>Nama barang pengganti<input data-n="${i.id}" value="${esc(i.nama)}"></label><label>Jumlah<input data-q="${i.id}" type="number" min="1" value="1"></label></div><div id="gu${i.id}" hidden><label>Nominal uang (Rp)<input data-u="${i.id}" type="number" inputmode="numeric"></label></div></div></div>`}).join('')}<p class="ee" id="e"></p><button class="p" onclick="retS(${id})">Simpan pengembalian</button>`)}
function rg(e){const i=e.dataset.i||e.dataset.t,k=$(`[data-i="${i}"]`).value,t=$(`[data-t="${i}"]`).value;$('#g'+i).hidden=k=='baik';$('#gb'+i).hidden=k=='baik'||t!='barang';$('#gu'+i).hidden=k=='baik'||t!='uang'}
function retS(id){const rs={};document.querySelectorAll('[data-i]').forEach(s=>{const i=s.dataset.i,v=a=>$(`[data-${a}="${i}"]`).value;rs[i]={k:s.value,c:v('c'),t:v('t'),n:v('n'),q:v('q'),u:v('u'),f:rp[i]||''}});run('returnLoan',{id,rs,tgl:$('#rt').value},()=>{rp={};closeM();draw();toast('Pengembalian dicatat')})}
function ph(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f)}
function pickPh(id,e){const f=e.files[0];if(f)ph(f,d=>{pp[id]=d;drawPick()})}
function retPh(id,e){const f=e.files[0];if(f)ph(f,d=>{rp[id]=d;const v=$('#pv'+id);v.src=d;v.hidden=false})}
function zoom(u){modal(`<img src="${u}" style="width:100%;border-radius:12px"><button class="p" onclick="closeM()">Tutup</button>`)}
const FM={};
function fm(t,F,a,base){FM.a=a;FM.b=base;modal(`<h2>${t}</h2>${F.map(([k,l,v,ty,o])=>`<label>${l}${o?`<select data-k="${k}">${o.map(([x,y])=>`<option value="${x}" ${x==v?'selected':''}>${esc(y)}</option>`).join('')}</select>`:`<input data-k="${k}" type="${ty||'text'}" value="${esc(v)}">`}</label>`).join('')}<p class="ee" id="e"></p><button class="p" onclick="fmS()">Simpan perubahan</button>`)}
function fmS(){const o={...FM.b};document.querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value);run(FM.a,o,()=>{closeM();draw();toast('Perubahan disimpan')})}
const del=(a,id)=>{if(confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.'))run(a,{id},()=>{draw();toast('Data dihapus')})};
function itemE(id){const i=it(id);fm('Ubah barang '+i.kode,[['n','Nama barang',i.nama],['c','Kategori',i.category_id,0,db.categories.map(c=>[c.id,c.nama])]],'editItem',{id})}
function kondE(id){const i=it(id);fm('Kondisi '+i.kode,[['k','Kondisi barang',i.status=='tersedia'?'normal':i.status,0,['normal','rusak','perbaikan','hilang'].map(x=>[x,x[0].toUpperCase()+x.slice(1)])]],'setKondisi',{id})}
function catE(id){fm('Ubah kategori',[['n','Nama kategori',cat(id).nama]],'editCategory',{id})}
function borE(id){const b=bn(id);fm('Ubah peminjam',[['n','Nama',b.nama],['h','No HP',b.hp],['a','Alamat atau RT',b.alamat]],'editBorrower',{id})}
function userE(id){const u=db.users.find(x=>x.id==id);fm('Ubah akun',[['n','Nama',u.nama],['u','Username',u.username],['p','Password baru (kosongkan jika tidak diganti)','','password']],'editUser',{id})}
function loanE(id){const l=db.loans.find(x=>x.id==id);fm('Ubah peminjaman',[['r','Rencana kembali',l.rencana,'date'],...l.d.map(x=>['c_'+x.iid,'Catatan kondisi '+it(x.iid).kode,x.cat||''])],'editLoan',{id})}
function catS(){run('addCategory',{n:$('#nc').value},()=>draw())}
function act(id){run('toggleUser',{id},()=>draw())}
function userS(){run('addUser',{n:$('#un').value,u:$('#uu').value,p:$('#up').value},()=>{draw();toast('Admin ditambahkan')})}
draw();
setInterval(poll,120000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible')poll()});
</script></body></html>
